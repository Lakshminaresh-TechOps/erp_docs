name: Trigger Gajbot Knowledge Reindex

on:
  push:
    branches:
      - production
    paths:
      - 'kb/**'
      - 'blog/**'
  workflow_dispatch:

jobs:
  reindex:
    name: Notify Gajbot Ingestion Service
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reindex Webhook
        env:
          REINDEX_WEBHOOK_URL: ${{ secrets.GAJBOT_REINDEX_WEBHOOK_URL }}
          REINDEX_TOKEN: ${{ secrets.GAJBOT_REINDEX_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$REINDEX_WEBHOOK_URL" ] || [ -z "$REINDEX_TOKEN" ]; then
            echo "::error ::GAJBOT_REINDEX_WEBHOOK_URL and GAJBOT_REINDEX_SECRET must be configured."
            exit 1
          fi

          payload=$(jq -cn --arg commit "$COMMIT_SHA" --arg message "$COMMIT_MESSAGE" \
            --arg repository "$SOURCE_REPOSITORY" \
            '{after:$commit, head_commit:{message:$message}, repository:{full_name:$repository}, ref:"refs/heads/production"}')
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$REINDEX_TOKEN" -hex | sed 's/^.* //')"
          echo "Triggering Command Center Gajbot reindex for commit $COMMIT_SHA..."
          curl --fail-with-body --silent --show-error --retry 2 -X POST "$REINDEX_WEBHOOK_URL" \
            -H "X-Hub-Signature-256: $signature" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -d "$payload"
          
          echo "Gajbot reindex triggered successfully."
